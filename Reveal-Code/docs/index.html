<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reveal — Support &amp; Privacy</title>
<style>
  :root{--bg:#FAF7F2;--card:#fff;--text:#2A2A2A;--muted:#5C5C5C;--accent:#8C7A4E;--border:rgba(0,0,0,.08)}
  @media (prefers-color-scheme:dark){:root{--bg:#161618;--card:#1E1E21;--text:#F2F2F2;--muted:#B8B2AA;--accent:#D9C48C;--border:rgba(255,255,255,.12)}}
  *{box-sizing:border-box}
  body{margin:0;padding:64px 20px;background:var(--bg);color:var(--text);
       font:16px/1.7 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif}
  .wrap{max-width:640px;margin:0 auto;text-align:center}
  h1{font-size:30px;margin:0 0 10px;letter-spacing:-.01em}
  p.sub{color:var(--muted);margin:0 0 36px}
  .cards{display:grid;gap:16px;grid-template-columns:1fr 1fr}
  @media (max-width:560px){.cards{grid-template-columns:1fr}}
  a.card{display:block;background:var(--card);border:1px solid var(--border);border-radius:16px;
         padding:24px;text-decoration:none;color:inherit;text-align:left}
  a.card strong{display:block;font-size:17px;margin-bottom:4px;color:var(--accent)}
  a.card span{color:var(--muted);font-size:14px}
  footer{margin-top:36px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Reveal</h1>
  <p class="sub">One verse a day, one reflection, one small action.</p>
  <div class="cards">
    <a class="card" href="support/">
      <strong>Support</strong>
      <span>How to use the app, common questions, and how to reach us.</span>
    </a>
    <a class="card" href="privacy/">
      <strong>Privacy Policy</strong>
      <span>What the app stores, what it sends, and what it never collects.</span>
    </a>
  </div>
  <footer>Reveal Mashal · revealmashal@gmail.com</footer>
</div>
</body>
</html>
